name: migrate

# Applies Drizzle migrations to Neon. Runs when migrations change, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/db/migrations/**"]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
